name: Собрать пробник для панели

# Панель Pterodactyl запускает `java -jar server.jar`, поэтому монитор для неё
# приходится собирать в jar. Локального JDK нет — компилируем здесь.

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Скомпилировать
        run: |
          mkdir -p out
          javac -d out java-probe/Probe.java
          jar --create --file probe.jar --main-class Probe -C out .
          ls -l probe.jar

      - uses: actions/upload-artifact@v4
        with:
          name: probe-jar
          path: probe.jar
