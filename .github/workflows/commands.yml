name: Команды бота

on:
  schedule:
    # Раз в 5 минут забираем накопившиеся сообщения — это и есть задержка ответа на /status.
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-check-state
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Поставить Xray
        run: |
          curl -sL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p bin
          unzip -o -q xray.zip xray -d bin
          chmod +x bin/xray

      - name: Обработать команды
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
          SUB_URL: ${{ secrets.SUB_URL }}
          PROXIES: ${{ secrets.PROXIES }}
          CHECK_NODES: ${{ secrets.SUB_URL != '' && '1' || '0' }}
          DIGEST_HOURS: ${{ secrets.DIGEST_HOURS }}
        run: python3 bot_poll.py

      - name: Сохранить состояние
        run: |
          git config user.name "gemini-check"
          git config user.email "gemini-check@users.noreply.github.com"
          git add state
          git diff --staged --quiet && echo "новых команд не было" && exit 0
          git commit -m "обработаны команды $(date -u '+%F %H:%M UTC')"
          git pull --rebase --autostash
          git push
