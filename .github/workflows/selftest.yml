name: Самопроверка

# Тесты — на каждый пуш кода. Вручную ещё и полная проверка с отчётом в лог,
# без Telegram и без записи состояния.

on:
  workflow_dispatch:
  push:
    paths: ["**.py", "services.json"]

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-xray

      - name: Тесты
        run: python3 -m unittest -v

      - name: Проверка
        if: github.event_name == 'workflow_dispatch'
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
          PS_API_KEY: ${{ secrets.PS_API_KEY }}
          PROXIES: ${{ secrets.PROXIES }}
        run: python3 bot.py --once
