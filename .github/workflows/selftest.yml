name: Самопроверка без отправки

# Ручной прогон полной проверки с выводом отчёта в лог — чтобы посмотреть
# картину из раннера, ничего не отправляя в Telegram.

on:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Поставить Xray
        run: |
          curl -sL -o xray.zip \
            https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          mkdir -p bin
          unzip -o -q xray.zip xray geoip.dat geosite.dat -d bin
          chmod +x bin/xray

      - name: Проверка
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
          PROXIES: ${{ secrets.PROXIES }}
          PS_API_KEY: ${{ secrets.PS_API_KEY }}
          CHECK_NODES: ${{ secrets.SUB_URL != '' && '1' || '0' }}
          STATE_FILE: /tmp/selftest-state.json
        run: python3 check.py --force --no-send
