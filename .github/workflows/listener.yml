name: Бот

# Смена длится пять часов (задача в Actions живёт не больше шести), потом бот
# сохраняет состояние и запускает следующую смену. Ежечасный cron подхватит,
# если цепочка оборвётся.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write
  actions: write

# Бот должен быть ровно один: новая смена ждёт, пока закончится текущая.
concurrency:
  group: gemini-check-listener
  cancel-in-progress: false

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-xray

      - name: Смена
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_IDS: ${{ secrets.TG_CHAT_IDS }}
          SUB_URL: ${{ secrets.SUB_URL }}
          PS_API_KEY: ${{ secrets.PS_API_KEY }}
          PROXIES: ${{ secrets.PROXIES }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SHIFT_MINUTES: "300"
        run: python3 bot.py

      - name: Сохранить состояние
        if: always()
        run: |
          git config user.name "gemini-check"
          git config user.email "gemini-check@users.noreply.github.com"
          git add state
          git diff --staged --quiet && exit 0
          git commit -m "состояние смены $(date -u '+%F %H:%M UTC')"
          git pull --rebase --autostash
          git push

      - name: Следующая смена
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run listener.yml --ref main
